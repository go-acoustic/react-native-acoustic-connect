def updateGradle(mp, json){
    def buildGradlePath = "$mp/build.gradle"
    def buildGradleFile = new File(buildGradlePath)
    def updatedBuildGradle = buildGradleFile.text

    if (json != null && json.Connect) {
        def useRelease = json.Connect.useRelease ?: false

        if(json.Connect.AndroidVersion != null) {
            def connectSDK = "io.github.go-acoustic:connect:"
            if(json.Connect.AndroidVersion.length() > 0) {
                connectSDK += json.Connect.AndroidVersion
            } else {
                connectSDK += "+"
            }
            updatedBuildGradle = updatedBuildGradle.replaceAll(~/io.github.go-acoustic:connect:(\+|\d+\.\d+\.\d+(-beta)?)/, connectSDK)
        }

        if (useRelease) {
            project.configurations.all {
                resolutionStrategy {
                    componentSelection {
                        all { selection ->
                            // Exempt the eocore artifact from beta rejection.
                            // Full Maven coordinate: io.github.go-acoustic:eocore
                            // (verified on Maven Central — the POM declares
                            // <groupId>io.github.go-acoustic</groupId> +
                            // <artifactId>eocore</artifactId>, so candidate.module is
                            // literally 'eocore').
                            // Unlike the other go-acoustic artifacts, eocore's RELEASE
                            // line carries a `-beta` suffix — Maven Central lists
                            // 2.1.24-beta as <release>/<latest>, and the release
                            // connect:11.0.13 → tealeaf:10.4.28 chain pins eocore
                            // transitively to that version. Without this carve-out the
                            // blanket `-beta` reject would drop a legitimate release
                            // artifact and break every useRelease=true build.
                            if (selection.candidate.group == 'io.github.go-acoustic' &&
                                selection.candidate.module != 'eocore' &&
                                selection.candidate.version.endsWith('-beta')) {
                                selection.reject("useRelease is true — rejecting beta version ${selection.candidate.version}")
                            }
                        }
                    }
                }
            }
        }
    }

    buildGradleFile.text = updatedBuildGradle
    println("Updating:$buildGradlePath")
}

try {
    // Resolve the SDK's android/ directory WITHOUT relying on a Gradle
    // subproject named ':react-native-acoustic-connect'. RN 0.82 + new
    // architecture does not guarantee that autolinking registers third-party
    // libraries as named Gradle subprojects, so `project(':...')` can throw
    // "Project with path ... could not be found" during sync. Resolving the
    // package via Node (the same mechanism the injected `apply from:` entry
    // point uses) works regardless of how/whether the library was autolinked.
    def sdkPackageJson = ["node", "--print", "require.resolve('react-native-acoustic-connect/package.json')"]
        .execute(null, project.rootDir).text.trim()
    def module_path = new File(sdkPackageJson).getParentFile().getAbsolutePath() + "/android"

    println("**Acoustic Integration***********************************************************************")
    println("Executing $module_path/config.gradle")
    println("Step 1:")
    def configJSONData = getConfigJSON()
    println("Step 2:")
    updateTealeafBasicConfig(module_path, configJSONData)
    println("Step 3:")
    updateConnectBasicConfig(module_path, configJSONData)
    println("Step 4:")
    // The app's own assets dir, used only to warn when it shadows what we write.
    def appAssetsDir = new File(project.rootDir, "app/src/main/assets")
    updateLayoutConfig(module_path, configJSONData, appAssetsDir.exists() ? appAssetsDir : null)
    println("Step 5:")
    updateAdvConfig(module_path, configJSONData)
    println("Step 6:")
    updateEOCoreBasicConfig(module_path, configJSONData)
    println("Step 7:")
    updateEOCoreAdvConfig(module_path, configJSONData)
    println("Step 8:")
    updateGradle(module_path, configJSONData)
    println("*********************************************************************************************")
} catch (FileNotFoundException e) {
    e.printStackTrace()
} catch (IOException e) {
    e.printStackTrace()
}
