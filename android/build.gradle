buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.10.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'jacoco'
apply from: '../nitrogen/generated/android/AcousticConnectRN+autolinking.gradle'

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["AcousticConnectRN_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["AcousticConnectRN_" + name]).toInteger()
}

android {
  namespace = "com.acousticconnectrn"

  ndkVersion = getExtOrDefault("ndkVersion")
  compileSdkVersion = getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
        "META-INF",
        "META-INF/**",
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig = true
    prefab = true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  testOptions {
    unitTests {
      // Unstubbed android.jar methods return defaults instead of throwing —
      // needed for the few framework calls Robolectric doesn't cover.
      returnDefaultValues = true
      // Robolectric needs the library manifest + resources on the test
      // classpath.
      includeAndroidResources = true
    }
  }

  // Java 17 — matched to React Native 0.82's own baseline (its Gradle plugin
  // targets JavaVersion.VERSION_17), so this imposes no requirement a consumer
  // does not already meet building an RN app. This file is compiled inside the
  // consumer's Gradle build, so anything raised here becomes their floor: 21
  // would put us above RN's baseline for no benefit, since the bridge uses no
  // Java 21 language features. Bytecode level only — deliberately NOT a
  // toolchain, so a consumer on JDK 21+ is free to build with it.
  //
  // Note this is independent of the Connect Android SDK shipping Java 21
  // bytecode: D8 dexes major-65 classes happily, and a JDK 17 assembleDebug
  // against that AAR succeeds. Only JVM unit tests that load those classes need
  // a 21 runtime, which is configured in the (unpublished) example build.
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // Kept in lockstep with compileOptions above — AGP fails the build with
  // "Inconsistent JVM-target compatibility" if the Java and Kotlin targets
  // diverge.
  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

// Read consumer config at script-evaluation time so the right Connect Android
// artifact is selected without depending on config.gradle's text-rewriting
// pass (which only matches the analytics artifact name). Read first, because
// the repositories below depend on it:
//   - `PushEnabled` picks between the analytics-only and push-fcm artifacts.
//   - `AndroidVersion` (when set) pins the version against the active artifact.
//   - `useRelease` picks where Connect comes from (see `allprojects` below).
import groovy.json.JsonSlurper
def acousticConfigFile = new File("$rootDir/../ConnectConfig.json")
def acousticConfig = acousticConfigFile.exists()
  ? new JsonSlurper().parse(acousticConfigFile)
  : [Connect: [:]]
def acousticPushEnabled = (acousticConfig.Connect?.PushEnabled ?: false).toString().toBoolean()
def acousticUseRelease = (acousticConfig.Connect?.useRelease ?: false).toString().toBoolean()
def acousticVersionPin = (acousticConfig.Connect?.AndroidVersion ?: '').trim()
def acousticVersion = acousticVersionPin.isEmpty() ? '+' : acousticVersionPin
def acousticArtifact = acousticPushEnabled ? 'connect-push-fcm' : 'connect'

println "AcousticConnectRN: PushEnabled=$acousticPushEnabled, useRelease=$acousticUseRelease, artifact=io.github.go-acoustic:$acousticArtifact:$acousticVersion"

// The supported Connect Android range — the same bounds as the `strictly`
// constraints below. Checked up front because the constraint cannot reject a
// pin on its own: a strict range is itself a request for the newest version in
// range, so an out-of-range pin was silently replaced by that version.
// The lower bound is the first published Connect Android build with everything
// the bridge relies on: the Connect APIs it calls (`canTakeScreenShot`,
// `getLayoutInfo`, `logDialogLayout`, from 11.1.1-beta), the screen-view fix
// that logs a return to a screen after one that is not captured (11.1.13-beta),
// and password fields captured as dots rather than as typed (11.1.16-beta).
// Gradle orders `11.1.16-beta` below `11.1.16` (a `-beta` qualifier sorts before
// the release with the same numbers), so the range admits the 11.1.16 release
// and everything newer. The numeric pin check below ignores qualifiers, so it
// compares against the bare [11, 1, 16].
def acousticMinVersion = [11, 1, 16]
def acousticMinVersionQualifier = '-beta'
def acousticMaxVersionExclusive = [12, 0, 0]
def acousticSupportedRange = "[${acousticMinVersion.join('.')}${acousticMinVersionQualifier}, ${acousticMaxVersionExclusive.join('.')})"
if (!acousticVersionPin.isEmpty()) {
  def m = acousticVersionPin =~ /^(\d+)\.(\d+)\.(\d+)/
  def compare = { a, b -> [a, b].transpose().collect { x, y -> x <=> y }.find { it != 0 } ?: 0 }
  def parts = m.find() ? [m.group(1), m.group(2), m.group(3)].collect { it as int } : null
  if (parts == null || compare(parts, acousticMinVersion) < 0 || compare(parts, acousticMaxVersionExclusive) >= 0) {
    throw new GradleException(
      "AcousticConnectRN: ConnectConfig.json Connect.AndroidVersion '$acousticVersionPin' is outside the " +
      "supported Connect Android range $acousticSupportedRange. " +
      "Set a version in that range, or leave it empty to use the newest."
    )
  }
}

repositories {
  mavenCentral()
  google()
}

allprojects {
    repositories {
        google()

        // `useRelease` decides where Connect comes from, for this module AND —
        // via config.gradle, which declares the same switch in the consuming
        // app — for the APK. The two must agree: this module compiles against
        // whatever it resolves here, while the app packages what the app
        // resolves, and a bridge compiled against a newer Connect than the APK
        // carries fails at runtime with NoSuchMethodError, not at build time.
        //
        //   useRelease: false (default) — the GitHub-hosted Maven tree, where
        //     Connect betas publish (they do not reach Maven Central). Central
        //     is still consulted for versions this tree does not carry.
        //   useRelease: true — Maven Central only, betas rejected below.
        //
        // `connect` resolves through a dynamic version, so Gradle queries
        // every declared repository and takes the newest match across all of
        // them; position only matters for a pinned version both carry, where
        // the artifact is identical. The content filter is not cosmetic:
        // without it every dependency in the build would hit
        // raw.githubusercontent and 404 before falling through.
        //
        // Declared only here, not also in the top-level `repositories` block:
        // `allprojects` covers this project too, so both would feed the same
        // resolution and the pair could drift.
        if (!acousticUseRelease) {
            maven {
                url = "https://raw.githubusercontent.com/go-acoustic/Android_Maven/master"
                content { includeGroup "io.github.go-acoustic" }
            }
        }

        mavenCentral()
        maven { url="https://s01.oss.sonatype.org/content/groups/staging" }

        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url="$rootDir/../node_modules/react-native/android"
        }
    }
}

// Same beta rejection config.gradle applies to the app, so with
// `useRelease: true` this module cannot compile against a beta either — a
// beta reached through the Sonatype staging repo or an `AndroidVersion` pin
// fails resolution here instead of diverging from the APK. eocore is exempt:
// its release line carries a `-beta` suffix (see config.gradle).
if (acousticUseRelease) {
  configurations.all {
    resolutionStrategy.componentSelection.all { selection ->
      if (selection.candidate.group == 'io.github.go-acoustic' &&
          selection.candidate.module != 'eocore' &&
          selection.candidate.version.endsWith('-beta')) {
        selection.reject("useRelease is true — rejecting beta version ${selection.candidate.version}")
      }
    }
  }
}

dependencies {
  // Provided by the host app at runtime — compileOnly avoids version conflicts
  //noinspection GradleDynamicVersion
  compileOnly "com.facebook.react:react-native:+"

  // Provided by the host app via react-native-nitro-modules peer dependency
  compileOnly project(":react-native-nitro-modules")

  // Connect Android SDK — analytics-only artifact OR push variant, never both.
  // The push-fcm artifact transitively brings in the core analytics module;
  // declaring both as direct dependencies would risk duplicate-class errors
  // and ambiguous version resolution. The selection is structural and gated
  // at build time by `ConnectConfig.json -> Connect.PushEnabled` — a customer
  // who didn't opt in for push can't accidentally pull in FCM transitives,
  // and a customer who did opt in gets the right module without a second
  // toggle.
  //noinspection GradleDynamicVersion
  implementation "io.github.go-acoustic:$acousticArtifact:$acousticVersion"

  // No direct eocore/tealeaf compile dependency anywhere in this module: the
  // bridge only calls Connect's own public API (Connect.updateConfig/
  // getConfigItem*, ConnectMonitoringLevel, ConnectScreenviewType,
  // Connect.logDialogLayout, Connect.canCaptureUserEvents,
  // Connect.canTakeScreenShot, Connect.getLayoutInfo, Connect.onDestroy, ...),
  // and android/src/test asserts on toSignalPayload's own output directly
  // instead of piping it through EOCore's real JsonUtil (see
  // HybridAcousticConnectRNTest's "SDK signal payload conversion" region) —
  // CA-159225.

  // Firebase Cloud Messaging — required by the push variant. The
  // `connect-push-fcm` AAR calls `com.google.firebase.messaging.*`
  // (its `FCMPushService` extends `FirebaseMessagingService`) but its
  // published POM does NOT declare firebase-messaging, so the transitive
  // never arrives. Without it the push classes fail to link at runtime and
  // push silently stays inactive — the bridge logs
  // `connect-push-fcm on classpath: false` and no FCM token is ever
  // requested. Gated by the same `PushEnabled` flag so analytics-only
  // builds pull zero Firebase. The host app still supplies its own
  // `google-services.json` and applies the `com.google.gms.google-services`
  // plugin (the bare-workflow demo does this conditionally). The BoM aligns
  // messaging + its installations/datatransport transitives.
  if (acousticPushEnabled) {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
  }

  // Version range enforced by the RN bridge. Lower bound prevents downgrades
  // to releases that lack APIs this bridge calls; upper bound prevents a
  // future 12.x major (with potentially breaking changes) from being picked
  // up automatically by Gradle's `+` resolver. Both halves are `strictly` so
  // nothing else in the build can move Connect outside them. A
  // `Connect.AndroidVersion` outside the range fails at configuration time
  // (the check after the config read above), not here. Constraints are declared for both artifact
  // names — Gradle only enforces the one that resolves into the graph, so
  // the unused entry is inert.
  //
  // An `AndroidVersion` pin is applied to BOTH constraints as `prefer`. With
  // push enabled the only direct dependency is `connect-push-fcm`, so the pin
  // used to reach `connect` only through that artifact's POM — and a strict
  // range is itself a request that resolves to the newest version in range,
  // so it outranked the transitive pin and floated `connect` past it
  // (`connect-push-fcm:11.1.5-beta` shipped with `connect:11.1.6-beta`).
  // `prefer` inside the strict range keeps the range as the hard bound and
  // makes the pin the version chosen within it.
  constraints {
    implementation('io.github.go-acoustic:connect') {
      version {
        strictly acousticSupportedRange
        if (!acousticVersionPin.isEmpty()) { prefer acousticVersionPin }
      }
      because "AcousticConnectRN requires Connect Android SDK in ${acousticSupportedRange} (the bridge uses Connect APIs added in 11.1). Bump the upper bound after validating compatibility with a new major."
    }
    implementation('io.github.go-acoustic:connect-push-fcm') {
      version {
        strictly acousticSupportedRange
        if (!acousticVersionPin.isEmpty()) { prefer acousticVersionPin }
      }
      because 'connect-push-fcm tracks the same release line as the core connect artifact.'
    }
  }
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "AcousticConnectRN"
    codegenJavaPackageName = "com.acousticconnectrn"
  }
}

// JVM unit tests (android/src/test) — run from a consumer app's gradle, e.g.
//   cd example/android && ./gradlew :react-native-acoustic-connect:testDebugUnitTest
// No emulator: testDebugUnitTest does not trigger externalNativeBuild/CMake.
// RN + nitro are compileOnly above (provided by the host app), so they are
// re-declared for the test runtime classpath; the Connect SDK is already
// `implementation` and flows to tests automatically. Note: nitro's Promise is
// JNI-backed, so the push*/logIdentity Promise-returning methods cannot be
// exercised in JVM tests — they are covered by the sample-build CI gates.
dependencies {
  testImplementation "junit:junit:4.13.2"
  testImplementation "io.mockk:mockk:1.13.16"
  // @Config(sdk = [35]) in the tests until Robolectric supports SDK 36.
  testImplementation "org.robolectric:robolectric:4.14.1"
  // Deliberately `+`, matching the compileOnly declaration above: this
  // coordinate never resolves from a repository — the RN Gradle plugin
  // substitutes it with the HOST app's `com.facebook.react:react-android`
  // at resolution time, so tests always run against the same RN version the
  // consuming build uses. Pinning (e.g. `0.82.1`) would name an artifact
  // version that doesn't exist on Maven for RN >= 0.72 and adds only false
  // precision; without the substitution both forms fail loudly.
  //noinspection GradleDynamicVersion
  testImplementation "com.facebook.react:react-native:+"
  testImplementation project(":react-native-nitro-modules")
}

// Coverage for the JVM unit tests. Robolectric needs
// includeNoLocationClasses to attribute coverage to instrumented classes.
tasks.withType(Test).configureEach {
  jacoco {
    includeNoLocationClasses = true
    excludes = ['jdk.internal.*']
  }
}

// XML (parsed by the Jenkins Slack summary) + HTML (archived artifact)
// coverage report over the debug unit tests. Registered afterEvaluate
// because AGP creates the variant test task then. Generated nitro bindings
// are excluded — they are codegen output, not logic this module owns.
project.afterEvaluate {
  tasks.register('jacocoDebugUnitTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'JaCoCo coverage report for the debug JVM unit tests.'

    def generatedExcludes = ['com/margelo/nitro/**', '**/BuildConfig*']
    classDirectories.setFrom(files(
      fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: generatedExcludes),
      fileTree(dir: "${buildDir}/intermediates/javac/debug", includes: ['**/classes/**'], excludes: generatedExcludes)
    ))
    sourceDirectories.setFrom(files("${projectDir}/src/main/java"))
    executionData.setFrom(fileTree(dir: buildDir, includes: ['jacoco/testDebugUnitTest.exec']))

    reports {
      xml.required = true
      html.required = true
    }
  }
}
